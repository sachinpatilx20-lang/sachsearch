<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SACH.IN</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        html {
            width: 100%;
            min-height: 100%;
            -webkit-text-size-adjust: 100%;
        }
        body {
            background-color: #000;
            color: #eee;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: max(clamp(20px, 4vh, 44px), env(safe-area-inset-top))
                     max(clamp(16px, 3.5vw, 40px), env(safe-area-inset-right))
                     max(44px, env(safe-area-inset-bottom))
                     max(clamp(16px, 3.5vw, 40px), env(safe-area-inset-left));
            overflow-x: hidden;
        }
        h1 {
            letter-spacing: 6px;
            font-weight: 600;
            margin: 0 0 clamp(16px, 3vh, 28px);
            user-select: none;
            font-size: clamp(24px, 4vw, 34px);
            text-align: center;
        }
        .search {
            position: relative;
            width: 100%;
            max-width: 820px;
        }
                #search {
            width: 100%;
            padding: 14px 22px;
            font-size: 16px;
            color: #fff;
            background: #141414;
            border: 1px solid #2e2e2e;
            border-radius: 999px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        #search:focus {
            border-color: #777;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.08);
        }
        #suggestions {
            position: absolute;
            top: 58px;
            left: 0;
            right: 0;
            background: #151515;
            border: 1px solid #333;
            border-radius: 14px;
            overflow-y: auto;
            max-height: 60vh;
            -webkit-overflow-scrolling: touch;
            z-index: 20;
            display: none;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.75);
        }
        #suggestions .sug-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 14px;
            cursor: pointer;
            transition: background .12s;
            border-bottom: 1px solid #1f1f1f;
        }
        #suggestions .sug-row:last-child { border-bottom: none; }
        #suggestions .sug-row:hover,
        #suggestions .sug-row.active {
            background: #252525;
        }
        #suggestions .sug-thumb {
            width: 42px;
            height: 58px;
            object-fit: cover;
            border-radius: 4px;
            background: #222;
            flex-shrink: 0;
        }
        #suggestions .sug-thumb-ph {
            width: 42px;
            height: 58px;
            background: #222;
            border-radius: 4px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 18px;
        }
        #suggestions .sug-text {
            flex: 1;
            min-width: 0;
        }
        #suggestions .sug-title {
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }
        #suggestions .sug-meta {
            color: #888;
            font-size: 12px;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #suggestions .sug-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        #suggestions .sug-link {
            color: #666;
            font-size: 12px;
            text-decoration: none;
            padding: 5px 8px;
            border-radius: 6px;
            border: 1px solid #2a2a2a;
            transition: color .15s, border-color .15s, background .15s;
        }
        #suggestions .sug-link:hover {
            color: #f5c518;
            border-color: #f5c518;
            background: rgba(245, 197, 24, 0.08);
        }
        #suggestions .sug-wl-btn {
            background: transparent;
            border: 1px solid #2a2a2a;
            color: #777;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: color .15s, border-color .15s, background .15s;
        }
        #suggestions .sug-wl-btn:hover {
            color: #fff;
            border-color: #444;
        }
        #suggestions .sug-wl-btn.saved {
            color: #f5c518;
            border-color: #f5c518;
            background: rgba(245, 197, 24, 0.1);
        }
        .sug-save-row {
            background: #1a1a1a;
            border-bottom: 1px solid #282828 !important;
        }
        .sug-save-row:hover {
            background: #232323 !important;
        }
        .hint {
            color: #666;
            font-size: 13px;
            margin-top: 12px;
            user-select: none;
        }

        /* App Tiles with Brand Icons - Fills full width across all devices */
        .apps {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 100%;
            margin-top: clamp(24px, 4vh, 36px);
        }
        .apps-tile-wrap {
            position: relative;
            display: flex;
            width: 100%;
        }
        .apps a,
        .apps-add-tile {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 8px;
            background: #141414;
            border: 1px solid #262626;
            border-radius: 12px;
            color: #ddd;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            width: 100%;
            cursor: pointer;
            transition: background .15s, transform .15s, border-color .15s, color .15s;
        }
        .apps a img {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            object-fit: contain;
            background: transparent;
        }
        .apps a:hover {
            background: #222;
            border-color: #3e3e3e;
            color: #fff;
            transform: translateY(-2px);
        }
        .apps-add-tile {
            background: #111;
            border: 1px dashed #333;
            color: #888;
        }
        .apps-add-tile:hover {
            background: #181818;
            border-color: #555;
            color: #fff;
            transform: translateY(-2px);
        }
        .apps-add-tile svg {
            color: #888;
            transition: color .15s, transform .15s;
        }
        .apps-add-tile:hover svg {
            color: #f5c518;
            transform: scale(1.1);
        }
        .app-del-btn {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #222;
            border: 1px solid #444;
            color: #bbb;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            line-height: 1;
            cursor: pointer;
            z-index: 10;
            padding: 0;
            transition: background .15s, color .15s, transform .15s, border-color .15s;
        }
        .apps-tile-wrap:hover .app-del-btn {
            display: flex;
        }
        .app-del-btn:hover {
            background: #e53935;
            border-color: #e53935;
            color: #fff;
            transform: scale(1.15);
        }

        /* Add App Box */
        .add-app-box {
            width: 100%;
            max-width: 100%;
            margin-top: 14px;
            background: #151515;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 16px;
        }
        .add-app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .add-app-title {
            font-size: 14px;
            font-weight: 500;
            color: #eee;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .add-app-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #addAppUrlInput,
        #addAppNameInput {
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #fff;
            padding: 11px 14px;
            font-size: 16px;
            outline: none;
            transition: border-color .15s;
        }
        #addAppUrlInput {
            flex: 1.4;
        }
        #addAppNameInput {
            flex: 1;
        }
        #addAppUrlInput:focus,
        #addAppNameInput:focus {
            border-color: #666;
        }
        .add-app-options {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .add-app-checkbox {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #888;
            cursor: pointer;
            user-select: none;
        }
        .add-app-checkbox input {
            cursor: pointer;
            accent-color: #f5c518;
        }

        /* Watch Later & Saved Links Bar - Full width */
        .wl-bar {
            width: 100%;
            max-width: 100%;
            margin-top: clamp(24px, 4vh, 36px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }
        .wl-pills {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .wl-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #151515;
            border: 1px solid #2a2a2a;
            color: #bbb;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: background .15s, border-color .15s, color .15s;
        }
        .wl-pill:hover,
        .wl-pill.active {
            background: #222;
            border-color: #444;
            color: #fff;
        }
        .wl-badge {
            background: #2a2a2a;
            color: #888;
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 999px;
            font-weight: 600;
            transition: background .15s, color .15s;
        }
        .wl-pill.has-items .wl-badge {
            background: #f5c518;
            color: #000;
        }

        /* Add Link Box - Full width */
        .add-link-box {
            width: 100%;
            max-width: 100%;
            margin-top: 14px;
            background: #151515;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 14px;
        }
        .add-link-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #addLinkInput {
            flex: 1;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #fff;
            padding: 11px 14px;
            font-size: 16px;
            outline: none;
            transition: border-color .15s;
        }
        #addLinkInput:focus {
            border-color: #666;
        }
        .primary-btn {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: background .15s, border-color .15s;
        }
        .primary-btn:hover {
            background: #333;
            border-color: #666;
        }
        .add-link-status {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
            min-height: 16px;
        }
        .add-link-status.loading { color: #8ab4ff; }
        .add-link-status.error   { color: #ff6b6b; }
        .add-link-status.success { color: #4ade80; }

        /* Watch Later & Saved Links Sections - Full width */
        #wlSection,
        #linksSection {
            width: 100%;
            max-width: 100%;
            margin-top: 20px;
            display: none;
        }
        #wlSection .header-row,
        #linksSection .header-row,
        #yt .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            gap: 10px;
            flex-wrap: wrap;
        }
        #wlSection h2,
        #linksSection h2,
        #yt h2 {
            font-size: 16px;
            color: #aaa;
            font-weight: 500;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .badge-count {
            font-size: 12px;
            color: #777;
            font-weight: normal;
        }
        .sec-btn {
            background: transparent;
            border: 1px solid #2a2a2a;
            color: #888;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: color .15s, border-color .15s, background .15s;
        }
        .sec-btn:hover {
            color: #fff;
            border-color: #444;
            background: #1c1c1c;
        }
        .sec-btn.danger:hover {
            color: #ff6b6b;
            border-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
        }
        .wl-empty {
            color: #666;
            font-size: 13px;
            padding: 24px 0;
            text-align: center;
            background: #111;
            border: 1px dashed #222;
            border-radius: 12px;
        }

        /* YouTube section - search only (hidden by default) - Full width */
        #yt {
            width: 100%;
            max-width: 100%;
            margin-top: 36px;
            display: none;
        }
        #yt .status {
            color: #777;
            font-size: 13px;
            margin-bottom: 14px;
            min-height: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #yt .badge-cache {
            font-size: 11px;
            color: #4ade80;
            background: rgba(74, 222, 128, 0.12);
            padding: 2px 7px;
            border-radius: 999px;
            border: 1px solid rgba(74, 222, 128, 0.25);
        }

        /* Fluid card grid filling the entire screen across all devices */
        .list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            width: 100%;
        }
        .card {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 12px;
            overflow: hidden;
            color: #eee;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background .12s, transform .12s, border-color .12s;
        }
        .card:hover {
            background: #1e1e1e;
            border-color: #383838;
            transform: translateY(-2px);
        }
        /* Thumbnail header container that dynamically fixes by image aspect ratio */
        .card-thumb-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #0d0d0d;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: aspect-ratio .25s ease;
        }
        .card-thumb-wrap.poster-wrap {
            aspect-ratio: 2/3;
        }
        /* Card thumbnail fills its container cleanly, matching true aspect ratio */
        .card img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            position: relative;
            z-index: 2;
            background: #141414;
            transition: transform .2s ease;
        }
        .card:hover img {
            transform: scale(1.02);
        }
        .card .duration {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            font-size: 11px;
            padding: 2px 5px;
            border-radius: 4px;
            font-weight: 500;
        }
        .card .tag-type {
            position: absolute;
            bottom: 6px;
            left: 6px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ddd;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            max-width: 80%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card .meta {
            padding: 12px;
            font-size: 13px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .card .card-domain-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #888;
            margin-bottom: 6px;
        }
        .card .card-domain-badge img {
            width: 14px;
            height: 14px;
            border-radius: 2px;
            display: inline-block;
        }
        .card .title {
            font-size: 14px;
            line-height: 1.35;
            margin-bottom: 6px;
            font-weight: 500;
            color: #f0f0f0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card .desc {
            font-size: 12px;
            color: #888;
            line-height: 1.4;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card .sub {
            color: #777;
            font-size: 11px;
            margin-top: auto;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Card overlay buttons */
        .wl-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ccc;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background .15s, color .15s, transform .15s, border-color .15s;
            z-index: 5;
            padding: 0;
        }
        .wl-btn:hover {
            background: rgba(0, 0, 0, 0.95);
            color: #fff;
            border-color: #fff;
            transform: scale(1.1);
        }
        .wl-btn.saved {
            background: #f5c518;
            color: #000;
            border-color: #f5c518;
        }
        .card-remove-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #bbb;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            transition: background .15s, color .15s, transform .15s;
            z-index: 5;
            padding: 0;
        }
        .card-remove-btn:hover {
            background: #e53935;
            color: #fff;
            border-color: #e53935;
            transform: scale(1.1);
        }
        .card-refresh-btn {
            position: absolute;
            top: 6px;
            right: 38px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #bbb;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            line-height: 1;
            cursor: pointer;
            transition: background .15s, color .15s, transform .15s;
            z-index: 5;
            padding: 0;
        }
        .card-refresh-btn:hover {
            background: #333;
            color: #fff;
            border-color: #666;
            transform: scale(1.1);
        }

        /* Footer - Centered and automatically pushed to the bottom to fill full screen height */
        .footer {
            margin-top: auto;
            padding-top: 48px;
            color: #555;
            font-size: 12px;
            text-align: center;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            width: 100%;
        }
        .footer kbd {
            background: #141414;
            border: 1px solid #282828;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 11px;
            color: #888;
        }

        /* RESPONSIVE DESIGN - FULL SCREEN ON ALL DEVICES */
        @media (max-width: 680px) {
            body {
                padding-left: max(14px, env(safe-area-inset-left));
                padding-right: max(14px, env(safe-area-inset-right));
            }
            .list {
                grid-template-columns: 1fr;
            }
            .wl-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .header-actions {
                justify-content: space-between;
                width: 100%;
            }
        }

        /* Card live update pulse and pending metadata badge */
        /* Pending / retry metadata state on refresh button */
        .card-refresh-btn.needs-retry {
            border-color: rgba(245, 197, 24, 0.55);
            color: #f5c518;
            background: rgba(245, 197, 24, 0.12);
        }
        .card.card-just-updated {
            border-color: #4ade80 !important;
            box-shadow: 0 0 16px rgba(74, 222, 128, 0.35);
            transition: border-color .3s, box-shadow .3s;
        }
        .card-refresh-btn.spinning {
            animation: spin 0.8s linear infinite !important;
            pointer-events: none;
            border-color: #f5c518 !important;
            color: #f5c518 !important;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes pulse-soft {
            0%, 100% { opacity: 0.85; }
            50% { opacity: 1; transform: scale(1.02); }
        }

        /* Footer - Centered and automatically pushed to the bottom to fill full screen height */
        .footer {
            margin-top: auto;
            padding-top: 48px;
            color: #555;
            font-size: 12px;
            text-align: center;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            width: 100%;
        }
        .footer kbd {
            background: #141414;
            border: 1px solid #282828;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 11px;
            color: #888;
        }

        /* RESPONSIVE DESIGN - FULL SCREEN ON ALL DEVICES */
        @media (max-width: 600px) {
            body {
                padding-left: max(12px, env(safe-area-inset-left));
                padding-right: max(12px, env(safe-area-inset-right));
            }
            .apps {
                grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
                gap: 8px;
            }

    function targetUrl(app) {
        if (!app) return "https://www.google.com/search?q=" + encodeURIComponent(input.value.trim());
        const q = input.value.trim();
        const [, base, noSearch] = app;
        return (noSearch || !q) ? base : base + encodeURIComponent(q);

    /* Render App tiles with icons, custom app delete, and + Add App tile */
    let appLinks = [];
    function renderApps() {
        appsEl.innerHTML = "";
        appLinks = [];
        APPS = [...DEFAULT_APPS, ...getCustomApps()];

        APPS.forEach(app => {
            const [name, , , iconUrl, id, isCustom] = app;
            const wrap = document.createElement("div");
            wrap.className = "apps-tile-wrap";

            const a = document.createElement("a");
            a.href = targetUrl(app);
            a.target = "_blank";
            a.rel = "noopener";
            a.title = name;

            const img = document.createElement("img");
            img.src = iconUrl || ("https://www.google.com/s2/favicons?domain=" + encodeURIComponent(name) + "&sz=64");
            img.alt = "";
            img.loading = "lazy";
            img.onerror = () => { img.style.display = "none"; };

            const span = document.createElement("span");
            span.textContent = name;

            a.append(img, span);
            a.addEventListener("click", () => { a.href = targetUrl(app); });
            wrap.appendChild(a);
            appLinks.push({ el: a, app });

            if (isCustom) {
                const delBtn = document.createElement("button");

                delBtn.type = "button";
                delBtn.innerHTML = "&times;";
                delBtn.title = "Remove " + name;
                delBtn.setAttribute("aria-label", "Remove " + name);
                delBtn.addEventListener("click", (e) => {
                    e.preventDefault();
                    e.stopPropagation();

                    saveCustomApps(updated);

    function toggleAddAppBox(forceOpen) {
        const isHidden = addAppBox.style.display === "none" || !addAppBox.style.display;

            addAppToggleBtn.setAttribute("aria-expanded", open ? "true" : "false");

        if (open) {

    async function handleAddApp() {
        let rawUrl = (addAppUrlInput.value || "").trim();
        if (!rawUrl) {
            addAppStatus.className = "add-link-status error";
            addAppStatus.textContent = "Please enter an app or website URL.";
            addAppUrlInput.focus();
            return;
        }

        if (!/^https?:\/\//i.test(rawUrl)) {
            rawUrl = "https://" + rawUrl;
        }

        let parsedUrl;
        try {
            parsedUrl = new URL(rawUrl);
        } catch {
            addAppStatus.className = "add-link-status error";
            addAppStatus.textContent = "Invalid URL format.";
            return;
        }

        const domain = parsedUrl.hostname.replace(/^www\./, "");
        addAppStatus.className = "add-link-status loading";
        addAppStatus.textContent = "Connecting & fetching app metadata\u2026";
        addAppSubmitBtn.disabled = true;

        try {
            const meta = await fetchUrlMetadata(rawUrl, {
                onProgress: (msg) => { addAppStatus.textContent = msg; },
                maxAttempts: 3,
                retryDelay: 1000
            });

            let name = (addAppNameInput.value || "").trim();
            if (!name) {
                if (meta && meta.publisher && meta.publisher.trim()) {
                    name = meta.publisher.trim();
                } else if (meta && meta.title && meta.title.trim()) {
                    const t = meta.title.trim().split(/[:\-|\u00b7]/)[0].trim();
                    name = t.length > 20 ? t.slice(0, 20) : t;
                } else {
                    const brand = domain.split(".")[0];
                    name = brand.charAt(0).toUpperCase() + brand.slice(1);
                }
            }

            let iconUrl = (meta && meta.favicon) ? meta.favicon : ("https://www.google.com/s2/favicons?domain=" + encodeURIComponent(domain) + "&sz=64");

            const isDirect = addAppDirectCheck.checked;
            let baseUrl = rawUrl;
            let noSearch = isDirect;

            if (!isDirect) {
                const d = domain.toLowerCase();
                if (d.includes("github.com")) {
                    baseUrl = "https://github.com/search?q=";
                } else if (d.includes("twitch.tv")) {
                    baseUrl = "https://www.twitch.tv/search?term=";
                } else if (d.includes("wikipedia.org")) {
                    baseUrl = "https://en.wikipedia.org/wiki/Special:Search?search=";
                } else if (d.includes("duckduckgo.com")) {
                    baseUrl = "https://duckduckgo.com/?q=";
                } else if (d.includes("amazon.")) {
                    baseUrl = `https://${domain}/s?k=`;
                } else if (d.includes("pinterest.")) {
                    baseUrl = "https://www.pinterest.com/search/pins/?q=";
                } else if (d.includes("x.com") || d.includes("twitter.com")) {
                    baseUrl = "https://x.com/search?q=";
                } else if (d.includes("reddit.com")) {
                    baseUrl = "https://www.reddit.com/search/?q=";
                } else {
                    if (parsedUrl.pathname === "/" || parsedUrl.pathname === "") {
                        baseUrl = rawUrl;
                        noSearch = true;
                    }
                }
            }

            const customApp = [
                name,
                baseUrl,
                noSearch,
                iconUrl,
                "app_" + Date.now(),
                true
            ];

            const list = getCustomApps();
            list.push(customApp);
            saveCustomApps(list);

            /* Proactively cache the brand icon in IndexedDB */
            try {
                const temp = new Image();
                loadThumb(temp, iconUrl, "app_icon:" + customApp[4]);
            } catch {}

            renderApps();
            syncAppLinks();

            addAppStatus.className = "add-link-status success";
            addAppStatus.textContent = `\u2713 Added "${name}" with metadata icon!`;
            addAppUrlInput.value = "";
            addAppNameInput.value = "";
            addAppDirectCheck.checked = false;

            setTimeout(() => {
                toggleAddAppBox(false);
            }, 1400);
        } catch (err) {
            console.error("Add app metadata fetch failed:", err);
            addAppStatus.className = "add-link-status error";
            addAppStatus.textContent = "Failed to fetch metadata. Please try again.";
        } finally {
            addAppSubmitBtn.disabled = false;
        }
    }


    /* METADATA CACHE - localStorage 3h TTL, prefix "m:" */
    const META_TTL = 3 * 60 * 60 * 1000;
    const _metaMem = new Map();

    function mGet(key) {
        if (_metaMem.has(key)) {
            const entry = _metaMem.get(key);
            if (Date.now() - entry.ts <= META_TTL) return entry.v;
            _metaMem.delete(key);
        }
        try {
            const raw = localStorage.getItem("m:" + key);
            if (!raw) return null;
            const { ts, v } = JSON.parse(raw);
            if (Date.now() - ts > META_TTL) {
                localStorage.removeItem("m:" + key);
                return null;
            }
            _metaMem.set(key, { ts, v });
            return v;
        } catch { return null; }
    }

    function mSet(key, value) {
        const payload = { ts: Date.now(), v: value };
        _metaMem.set(key, payload);
        try {
            localStorage.setItem("m:" + key, JSON.stringify(payload));
        } catch {
            /* Evict oldest entries on quota exceed */
            try {
                const list = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    if (k && k.startsWith("m:")) {
                        try { list.push({ k, ts: JSON.parse(localStorage.getItem(k)).ts }); } catch {}
                    }
                }
                list.sort((a, b) => a.ts - b.ts).slice(0, Math.ceil(list.length / 2)).forEach(({ k }) => localStorage.removeItem(k));
                localStorage.setItem("m:" + key, JSON.stringify(payload));
            } catch {}
        }
    }

    /* THUMBNAIL CACHE - IndexedDB permanent DB="sach_thumbs" Store="t" */
    let _idb = null;
    const _thumbMem = new Map();

    function _openIDB() {
        return new Promise((res, rej) => {
            const req = indexedDB.open("sach_thumbs", 1);
            req.onupgradeneeded = e => e.target.result.createObjectStore("t");
            req.onsuccess = e => res(e.target.result);
            req.onerror   = () => rej(req.error);
        });
    }
    async function _getDB() {
        try { return _idb || (_idb = await _openIDB()); } catch { return null; }
    }
    async function idbGet(id) {
        if (_thumbMem.has(id)) return _thumbMem.get(id);
        try {
            const db = await _getDB();
            if (!db) return null;
            return await new Promise(res => {
                const r = db.transaction("t", "readonly").objectStore("t").get(id);
                r.onsuccess = () => {
                    if (r.result) _thumbMem.set(id, r.result);
                    res(r.result || null);
                };
                r.onerror = () => res(null);
            });
        } catch { return null; }
    }
    async function idbPut(id, dataUrl) {
        if (!dataUrl) return;
        _thumbMem.set(id, dataUrl);
        try {
            const db = await _getDB();
            if (!db) return;
            await new Promise(res => {
                const tx = db.transaction("t", "readwrite");
                tx.objectStore("t").put(dataUrl, id);
                tx.oncomplete = res;
                tx.onerror = res;
            });
        } catch {}
    }

    /* Canvas fetch (works for CORS-enabled images e.g. ytimg.com) */
    function _canvasFetch(url) {
        return new Promise(res => {
            const img = new Image();
            img.crossOrigin = "anonymous";
            const tid = setTimeout(() => res(null), 4000);
            img.onload = () => {
                clearTimeout(tid);
                try {
                    const c = document.createElement("canvas");
                    c.width = img.naturalWidth || 320;
                    c.height = img.naturalHeight || 180;
                    c.getContext("2d").drawImage(img, 0, 0);
                    res(c.toDataURL("image/jpeg", 0.82));
                } catch { res(null); }
            };
            img.onerror = () => { clearTimeout(tid); res(null); };
            img.src = url;
        });
    }

    /* Weserv CORS image proxy (ultra-fast, transforms amazon & blocked CDNs to CORS) */
    async function _weservFetch(url) {
        try {
            const proxied = "https://images.weserv.nl/?url=" + encodeURIComponent(url) + "&w=260&output=jpg";
            const r = await fetch(proxied);
            if (!r.ok) return null;
            const blob = await r.blob();
            return await new Promise(res => {
                const fr = new FileReader();
                fr.onload = () => res(fr.result);
                fr.onerror = () => res(null);
                fr.readAsDataURL(blob);
            });
        } catch { return null; }
    }

    /* Allorigins raw proxy fallback */
    async function _alloriginsFetch(url) {
        try {
            const r = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(url));
            if (!r.ok) return null;
            const blob = await r.blob();
            return await new Promise(res => {
                const fr = new FileReader();
                fr.onload = () => res(fr.result);
                fr.onerror = () => res(null);
                fr.readAsDataURL(blob);
            });
        } catch { return null; }
    }

    /* Automatically adapt thumbnail container to image natural aspect ratio */
    function applyThumbAspect(imgEl) {
        if (!imgEl) return;
        const w = imgEl.naturalWidth;
        const h = imgEl.naturalHeight;
        if (w > 0 && h > 0) {
            const ratio = w / h;
            /* Clamp ratio between 0.65 (standard 2:3 vertical poster) and 2.15 (panoramic banner) */
            const clamped = Math.max(0.65, Math.min(2.15, ratio));
            const wrap = imgEl.closest ? imgEl.closest(".card-thumb-wrap") : (imgEl.parentElement ? imgEl.parentElement.closest(".card-thumb-wrap") : null);
            if (wrap) {
                wrap.style.aspectRatio = clamped.toFixed(3);
            }
        }
    }

    /* loadThumb: instant cache load, background persistent save & natural aspect adaptation */
    function loadThumb(imgEl, url, id) {
        if (!url) return;
        function applySrc(src) {
            imgEl.src = src;
            if (imgEl.complete && imgEl.naturalWidth > 0) {
                applyThumbAspect(imgEl);
            }
        }

        /* Dynamically adapt card aspect ratio as soon as image finishes loading */
        imgEl.addEventListener("load", () => {
            applyThumbAspect(imgEl);
        }, { once: true });

        /* Instant memory hit */
        if (_thumbMem.has(id)) {
            applySrc(_thumbMem.get(id));
            return;
        }
        /* Check IndexedDB */
        idbGet(id).then(async hit => {
            if (hit) {
                applySrc(hit);
                return;
            }
            /* Start with direct URL for immediate display */
            applySrc(url);
            /* Acquire local base64 version and persist */
            const dataUrl = (await _canvasFetch(url)) ||
                            (await _weservFetch(url)) ||
                            (await _alloriginsFetch(url));
            if (dataUrl) {
                idbPut(id, dataUrl);
                applySrc(dataUrl);
            }
        });
    }

        const list = getWatchLater();
        const idx = list.findIndex(x => x.id === item.id);
        if (idx >= 0) {
            list.splice(idx, 1);
        } else {
            list.unshift({
                ...item,
                savedAt: Date.now()
            });
            /* Ensure thumbnail is persisted locally in IndexedDB */
            if (item.thumbUrl) {
                const cacheId = (item.type === "imdb" ? "imdb:" : "yt:") + item.id;
                idbGet(cacheId).then(hit => {
                    if (!hit) {

                        loadThumb(tempImg, item.thumbUrl, cacheId);

                });

                ? ("https://www.imdb.com/title/" + encodeURIComponent(item.id) + "/")
                : ("https://www.youtube.com/watch?v=" + encodeURIComponent(item.id));

            const thumbWrap = document.createElement("div");
            thumbWrap.className = "card-thumb-wrap" + (item.type === "imdb" ? " poster-wrap" : "");

            const img = document.createElement("img");

            thumbWrap.appendChild(img);

            const cacheKey = (item.type === "imdb" ? "imdb:" : "wl:") + item.id;
            loadThumb(img, item.thumbUrl, cacheKey);

            if (item.length) {
                const dur = document.createElement("span");
                dur.className = "duration";

            }

            const meta = document.createElement("div");

            const tEl = document.createElement("div");

            const subEl = document.createElement("div");

            subEl.textContent = [item.channel, item.length].filter(Boolean).join(" \u00b7 ");

            meta.append(tEl, subEl);

        /* Helper: Verify if metadata has rich title, real image, and description */
    function isMetadataRich(meta) {
        if (!meta) return false;
        const title = (meta.title || "").trim();
        const domain = (meta.domain || "").trim().toLowerCase();
        const isDomainTitle = !title || title.toLowerCase() === domain || 
                              title.toLowerCase() === "http://" + domain || 
                              title.toLowerCase() === "https://" + domain;
        const hasRealTitle = !isDomainTitle && title.length > 1;
        const img = (meta.image || "").trim();
        const hasRealThumb = img && !img.includes("mshots/v1") && !img.includes("favicons?domain");
        const hasDesc = meta.description && meta.description.trim().length > 10;
        const hasPub = meta.publisher && meta.publisher.trim().toLowerCase() !== domain;
        return Boolean(hasRealTitle && (hasRealThumb || hasDesc || hasPub));
    }

    /* Helper: Convert relative URLs to absolute */
    function _toAbsoluteUrl(raw, baseUrl) {
        if (!raw) return "";
        try {
            return new URL(raw, baseUrl).href;
        } catch {
            return raw;
        }
    }

    /* Helper: Parse HTML into OpenGraph and meta tag attributes */
    function _parseHtmlMetadata(html, url, domain) {
        if (!html) return null;
        try {
            const doc = new DOMParser().parseFromString(html, "text/html");
            const ogTitle = doc.querySelector('meta[property="og:title"]')?.content ||
                            doc.querySelector('meta[name="twitter:title"]')?.content ||
                            doc.querySelector('meta[name="title"]')?.content ||
                            doc.title;
            const ogDesc  = doc.querySelector('meta[property="og:description"]')?.content ||
                            doc.querySelector('meta[name="twitter:description"]')?.content ||
                            doc.querySelector('meta[name="description"]')?.content;
            const rawImg  = doc.querySelector('meta[property="og:image"]')?.content ||
                            doc.querySelector('meta[property="og:image:secure_url"]')?.content ||
                            doc.querySelector('meta[name="twitter:image"]')?.content ||
                            doc.querySelector('meta[name="twitter:image:src"]')?.content ||
                            doc.querySelector('link[rel="image_src"]')?.href ||
                            doc.querySelector('link[rel="apple-touch-icon"]')?.href;
            const site    = doc.querySelector('meta[property="og:site_name"]')?.content;
            const author  = doc.querySelector('meta[name="author"]')?.content ||
                            doc.querySelector('meta[property="article:author"]')?.content;
            const iconEl  = doc.querySelector('link[rel="icon"][sizes="192x192"]')?.href ||
                            doc.querySelector('link[rel="icon"][type="image/png"]')?.href ||
                            doc.querySelector('link[rel="apple-touch-icon"]')?.href ||
                            doc.querySelector('link[rel="shortcut icon"]')?.href ||
                            doc.querySelector('link[rel="icon"]')?.href;

            const res = {};
            if (ogTitle && ogTitle.trim() && ogTitle.trim().toLowerCase() !== domain) {
                res.title = ogTitle.trim();
            }
            if (ogDesc && ogDesc.trim()) res.description = ogDesc.trim();
            if (site && site.trim()) res.publisher = site.trim();
            if (author && author.trim()) res.author = author.trim();
            if (rawImg && rawImg.trim()) res.image = _toAbsoluteUrl(rawImg.trim(), url);
            if (iconEl && iconEl.trim()) res.favicon = _toAbsoluteUrl(iconEl.trim(), url);
            return res;
        } catch {
            return null;
        }
    }

    /* Fast zero-proxy extractors for major platforms */
    async function _trySpecializedExtractors(url, domain) {
        /* YouTube */
        const ytIdMatch = url.match(/(?:youtube\.com\/(?:watch\?.*v=|embed\/|v\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/i);
        if (ytIdMatch) {
            const yId = ytIdMatch[1];
            const meta = {
                image: "https://i.ytimg.com/vi/" + yId + "/hqdefault.jpg",
                publisher: "YouTube",
                title: "YouTube Video"
            };
            try {
                const oe = await _ytOembed(yId);
                if (oe) {
                    if (oe.title) meta.title = oe.title;
                    if (oe.channel) meta.author = oe.channel;
                    if (oe.thumbUrl) meta.image = oe.thumbUrl;
                }
            } catch {}
            return meta;
        }

        /* Direct Images */
        if (/\.(jpg|jpeg|png|webp|gif|svg)(\?.*)?$/i.test(url)) {
            const filename = url.split("/").pop().split("?")[0] || domain;
            return {
                image: url,
                title: filename,
                publisher: domain
            };
        }

        /* Wikipedia API (100% open CORS) */
        const wikiMatch = url.match(/([a-z]{2,3})\.wikipedia\.org\/wiki\/([^#?]+)/i);
        if (wikiMatch) {
            try {
                const lang = wikiMatch[1];
                const pageTitle = wikiMatch[2];
                const apiUrl = `https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(pageTitle)}`;
                const ctrl = new AbortController();
                const tid = setTimeout(() => ctrl.abort(), 4000);
                const r = await fetch(apiUrl, { signal: ctrl.signal });
                clearTimeout(tid);
                if (r.ok) {
                    const data = await r.json();
                    return {
                        title: data.title || pageTitle.replace(/_/g, " "),
                        description: data.extract || data.description || "",
                        image: data.originalimage?.source || data.thumbnail?.source || "",
                        publisher: "Wikipedia"
                    };
                }
            } catch {}
        }

        /* GitHub API (100% open CORS) */
        const ghMatch = url.match(/github\.com\/([a-zA-Z0-9_.-]+)\/([a-zA-Z0-9_.-]+)(?:$|\/)/i);
        if (ghMatch && ghMatch[1] !== "features" && ghMatch[1] !== "pricing") {
            try {
                const owner = ghMatch[1];
                const repo = ghMatch[2];
                const apiUrl = `https://api.github.com/repos/${owner}/${repo}`;
                const ctrl = new AbortController();
                const tid = setTimeout(() => ctrl.abort(), 4000);
                const r = await fetch(apiUrl, { signal: ctrl.signal });
                clearTimeout(tid);
                if (r.ok) {
                    const data = await r.json();
                    return {
                        title: `${data.name} \u2014 ${data.description || 'GitHub repository'}`,
                        description: data.description || `GitHub repository by ${owner}`,
                        image: `https://opengraph.githubassets.com/1/${owner}/${repo}`,
                        author: owner,
                        publisher: "GitHub"
                    };
                }
            } catch {}
        }

        /* Spotify oEmbed */
        if (/open\.spotify\.com\/(track|album|playlist|show)\//i.test(url)) {
            try {
                const apiUrl = `https://open.spotify.com/oembed?url=${encodeURIComponent(url)}`;
                const ctrl = new AbortController();
                const tid = setTimeout(() => ctrl.abort(), 4000);
                const r = await fetch(apiUrl, { signal: ctrl.signal });
                clearTimeout(tid);
                if (r.ok) {
                    const data = await r.json();
                    return {
                        title: data.title || "Spotify Track",
                        image: data.thumbnail_url || "",
                        author: data.author_name || "",
                        publisher: "Spotify"
                    };
                }
            } catch {}
        }

        /* Twitter / X oEmbed */
        if (/(?:twitter\.com|x\.com)\/[^/]+\/status\//i.test(url)) {
            try {
                const apiUrl = `https://publish.twitter.com/oembed?url=${encodeURIComponent(url)}`;
                const ctrl = new AbortController();
                const tid = setTimeout(() => ctrl.abort(), 4000);
                const r = await fetch(apiUrl, { signal: ctrl.signal });
                clearTimeout(tid);
                if (r.ok) {
                    const data = await r.json();
                    return {
                        title: data.author_name ? `Post by ${data.author_name}` : "X Post",
                        author: data.author_name || "",
                        publisher: "X (Twitter)"
                    };
                }
            } catch {}
        }

        return null;
    }

    /* Extract comprehensive OpenGraph / HTML metadata & thumbnails with progressive multi-gateway retries */
    async function fetchUrlMetadata(rawUrl, options = {}) {

        let url = (rawUrl || "").trim();
        if (!url) return null;

        const defaultFavicon = "https://www.google.com/s2/favicons?domain=" + encodeURIComponent(domain) + "&sz=128";

        const meta = {
            id:          "link_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
            url:         url,
            domain:      domain,
            publisher:   domain,
            title:       domain,
            description: "",
            image:       "",
            favicon:     defaultFavicon,
            author:      "",
            savedAt:     Date.now(),
            needsMetadataRetry: true,
            metadataStatus: "pending"
        };

        /* Step 1: Check specialized zero-proxy domain handlers first */
        const spec = await _trySpecializedExtractors(url, domain);
        if (spec) {
            if (spec.title)       meta.title = spec.title;
            if (spec.description) meta.description = spec.description;
            if (spec.image)       meta.image = spec.image;
            if (spec.publisher)   meta.publisher = spec.publisher;
            if (spec.author)      meta.author = spec.author;
            if (spec.favicon)     meta.favicon = spec.favicon;
            if (isMetadataRich(meta)) {
                meta.needsMetadataRetry = false;
                meta.metadataStatus = "success";
                if (onProgress) onProgress("Metadata & thumbnail retrieved!", 1, true);
                return meta;
            }
        }

        /* Step 2: Multi-Attempt Progressive Retry Loop across Gateways */
        for (let attempt = 1; attempt <= maxAttempts; attempt++) {
            if (onProgress) {
                const label = attempt === 1 
                    ? "Connecting & fetching rich metadata\u2026"
                    : `Retrying metadata gateway (Attempt ${attempt}/${maxAttempts})\u2026`;
                onProgress(label, attempt, false);
            }

            /* Try Gateway 1: Microlink */
            const ml = await _fetchFromMicrolink(url);
            if (ml) {
                if (ml.title && meta.title === domain) meta.title = ml.title;
                if (ml.description && !meta.description) meta.description = ml.description;
                if (ml.image && !meta.image) meta.image = ml.image;
                if (ml.publisher && meta.publisher === domain) meta.publisher = ml.publisher;
                if (ml.author && !meta.author) meta.author = ml.author;
                if (ml.favicon && (!meta.favicon || meta.favicon === defaultFavicon)) meta.favicon = ml.favicon;

                if (isMetadataRich(meta)) {
                    meta.needsMetadataRetry = false;
                    meta.metadataStatus = "success";
                    if (onProgress) onProgress("Metadata & thumbnail retrieved!", attempt, true);
                    return meta;
                }
            }

            /* Try Gateway 2: CorsProxy.org */
            const cp = await _fetchFromCorsProxyOrg(url, domain);
            if (cp) {
                if (cp.title && meta.title === domain) meta.title = cp.title;
                if (cp.description && !meta.description) meta.description = cp.description;
                if (cp.image && !meta.image) meta.image = cp.image;
                if (cp.publisher && meta.publisher === domain) meta.publisher = cp.publisher;
                if (cp.author && !meta.author) meta.author = cp.author;
                if (cp.favicon && (!meta.favicon || meta.favicon === defaultFavicon)) meta.favicon = cp.favicon;

                if (isMetadataRich(meta)) {
                    meta.needsMetadataRetry = false;
                    meta.metadataStatus = "success";
                    if (onProgress) onProgress("Metadata & thumbnail retrieved!", attempt, true);
                    return meta;
                }
            }

            /* Try Gateway 3: AllOrigins */
            const ao = await _fetchFromAllOrigins(url, domain);
            if (ao) {
                if (ao.title && meta.title === domain) meta.title = ao.title;
                if (ao.description && !meta.description) meta.description = ao.description;
                if (ao.image && !meta.image) meta.image = ao.image;
                if (ao.publisher && meta.publisher === domain) meta.publisher = ao.publisher;
                if (ao.author && !meta.author) meta.author = ao.author;
                if (ao.favicon && (!meta.favicon || meta.favicon === defaultFavicon)) meta.favicon = ao.favicon;

                if (isMetadataRich(meta)) {
                    meta.needsMetadataRetry = false;
                    meta.metadataStatus = "success";
                    if (onProgress) onProgress("Metadata & thumbnail retrieved!", attempt, true);
                    return meta;
                }
            }

            /* Try Gateway 4: CodeTabs */
            const ct = await _fetchFromCodeTabs(url, domain);
            if (ct) {
                if (ct.title && meta.title === domain) meta.title = ct.title;
                if (ct.description && !meta.description) meta.description = ct.description;
                if (ct.image && !meta.image) meta.image = ct.image;
                if (ct.publisher && meta.publisher === domain) meta.publisher = ct.publisher;
                if (ct.author && !meta.author) meta.author = ct.author;
                if (ct.favicon && (!meta.favicon || meta.favicon === defaultFavicon)) meta.favicon = ct.favicon;

                if (isMetadataRich(meta)) {
                    meta.needsMetadataRetry = false;
                    meta.metadataStatus = "success";
                    if (onProgress) onProgress("Metadata & thumbnail retrieved!", attempt, true);
                    return meta;
                }
            }

            /* If not successful yet and have more attempts, wait backoff delay */
            if (attempt < maxAttempts) {
                await new Promise(r => setTimeout(r, retryDelay * attempt));
            }
        }

        /* Fallback Visual: WordPress mShots Screenshot thumbnail */
        if (!meta.image) {
            meta.image = "https://s0.wp.com/mshots/v1/" + encodeURIComponent(url) + "?w=640";
        }

        return meta;
    }

    /* Save URL handler with interactive progress and automatic background queuing */
    async function handleSaveUrl(rawUrl) {
        if (!rawUrl || !rawUrl.trim()) return;
        addLinkStatus.className = "add-link-status loading";
        addLinkStatus.textContent = "Connecting & fetching rich metadata\u2026";

        try {
            const meta = await fetchUrlMetadata(rawUrl, {
                onProgress: (msg) => { addLinkStatus.textContent = msg; },
                maxAttempts: 3,
                retryDelay: 1000
            });

            if (!meta) {
                addLinkStatus.className = "add-link-status error";
                addLinkStatus.textContent = "Invalid URL.";
                return;
            }

            const list = getSavedLinks();
            list.unshift(meta);
            saveSavedLinks(list);

            /* Proactively persist preview thumbnail into IndexedDB */
            if (meta.image) {
                const tempImg = new Image();
                loadThumb(tempImg, meta.image, "link:" + meta.id);
            }

            addLinkStatus.className = "add-link-status success";
            addLinkStatus.textContent = "\u2713 Saved link: " + (meta.title || meta.domain || "link");
            addLinkInput.value = "";

            /* Expand Saved Links section */
            linksSection.style.display = "block";
            linksToggleBtn.classList.add("active");
            linksToggleBtn.setAttribute("aria-expanded", "true");
            try { localStorage.setItem(LINKS_OPEN_KEY, "1"); } catch {}

            setTimeout(() => {
                addLinkStatus.textContent = "";
                addLinkBox.style.display = "none";
            }, 2400);
        } catch {
            addLinkStatus.className = "add-link-status error";
            addLinkStatus.textContent = "Error saving link.";
        }
    }

    /* Update a visible card in the DOM in-place without rebuilding the whole list */
    function updateLiveCard(item) {
        if (!item || !item.id) return;
        const card = document.querySelector(`.card[data-link-id="${item.id}"]`);
        if (!card) return;

        /* Update Title */
        const titleEl = card.querySelector(".title");
        if (titleEl && item.title) {
            titleEl.textContent = item.title;
        }

        /* Update or insert Description */
        const metaEl = card.querySelector(".meta");
        let descEl = card.querySelector(".desc");
        if (item.description) {
            if (!descEl && metaEl) {
                descEl = document.createElement("div");
                descEl.className = "desc";
                const subEl = card.querySelector(".sub");
                if (subEl) metaEl.insertBefore(descEl, subEl);
                else metaEl.appendChild(descEl);
            }
            if (descEl) descEl.textContent = item.description;
        }

        /* Update Publisher / Tag */
        const tagEl = card.querySelector(".tag-type");
        if (tagEl) {
            tagEl.textContent = item.publisher || item.domain;
        }

        /* Update Thumbnail Image */
        if (item.image) {
            const imgEl = card.querySelector("img");
            if (imgEl && imgEl.src !== item.image) {
                loadThumb(imgEl, item.image, "link:" + item.id);
            }
        }

        /* Update refresh button retry status */
        const refreshBtn = card.querySelector(".card-refresh-btn");
        if (refreshBtn) {
            if (isMetadataRich(item)) {
                refreshBtn.classList.remove("needs-retry");
                refreshBtn.title = "Refresh metadata & thumbnail";
            } else {
                refreshBtn.classList.add("needs-retry");
                refreshBtn.title = "Retry / Refresh metadata & thumbnail";
            }
        }
        /* Subtle flash animation */
        card.classList.add("card-just-updated");
        setTimeout(() => card.classList.remove("card-just-updated"), 2200);
    }

    /* Refresh metadata for a specific link */
    async function refreshLinkMetadata(id, forceInteractive = false) {
        const list = getSavedLinks();
        const item = list.find(x => x.id === id);
        if (!item) return;

        const card = document.querySelector(`.card[data-link-id="${id}"]`);
        const refreshBtn = card?.querySelector(".card-refresh-btn");
        if (refreshBtn) refreshBtn.classList.add("spinning");

        try {
            const updated = await fetchUrlMetadata(item.url, {
                maxAttempts: forceInteractive ? 4 : 2,
                retryDelay: 1000
            });
            if (updated) {
                updated.id = item.id;
                updated.savedAt = item.savedAt;
                if (isMetadataRich(updated)) {
                    updated.needsMetadataRetry = false;
                    updated.metadataStatus = "success";
                }
                const idx = list.findIndex(x => x.id === id);
                list[idx] = updated;
                saveSavedLinks(list);
                updateLiveCard(updated);
                if (updated.image) {
                    const temp = new Image();
                    loadThumb(temp, updated.image, "link:" + updated.id);
                }
                if (refreshBtn) {
                    refreshBtn.innerHTML = "&#10003;";
                    setTimeout(() => { refreshBtn.innerHTML = "&#8635;"; }, 1800);
                }
            }
        } catch {} finally {
            if (refreshBtn) refreshBtn.classList.remove("spinning");
        }
    }

    /* Refresh all saved links with live progress counter */
    async function refreshAllLinksMetadata() {
        const list = getSavedLinks();
        if (!list.length) return;
        linksRefreshAllBtn.disabled = true;
        for (let i = 0; i < list.length; i++) {
            linksRefreshAllBtn.textContent = `Refreshing (${i + 1}/${list.length})\u2026`;
            await refreshLinkMetadata(list[i].id, true);
            await new Promise(r => setTimeout(r, 600));
        }
        linksRefreshAllBtn.textContent = "\u2713 All Updated";
        setTimeout(() => {
            linksRefreshAllBtn.disabled = false;
            linksRefreshAllBtn.textContent = "\u21bb Refresh All";
        }, 2000);
    }

            refreshBtn.type = "button";
            refreshBtn.title = "Retry / Refresh metadata & thumbnail";
            refreshBtn.setAttribute("aria-label", "Retry metadata & thumbnail");
            refreshBtn.innerHTML = "&#8635;";
            refreshBtn.addEventListener("click", async e => {
                e.preventDefault();
                e.stopPropagation();
                refreshBtn.classList.add("spinning");
                await refreshLinkMetadata(item.id, true);
                refreshBtn.classList.remove("spinning");
            });
            a.appendChild(refreshBtn);

            /* Thumbnail preview fixed by natural aspect ratio */
            const thumbWrap = document.createElement("div");

            const img = document.createElement("img");
            img.alt = "";
            img.loading = "lazy";
            thumbWrap.appendChild(img);

            loadThumb(img, item.image, "link:" + item.id);

            if (item.publisher || item.domain) {
                const tag = document.createElement("span");
                tag.className = "tag-type";
                tag.textContent = item.publisher || item.domain;
                thumbWrap.appendChild(tag);
            }
            a.appendChild(thumbWrap);

            const meta = document.createElement("div");
            meta.className = "meta";

            /* Domain badge with favicon */
            const domainRow = document.createElement("div");
            domainRow.className = "card-domain-badge";
            if (item.favicon) {
                const favImg = document.createElement("img");
                favImg.src = item.favicon;
                favImg.alt = "";
                favImg.loading = "lazy";
                favImg.onerror = () => { favImg.style.display = "none"; };
                domainRow.appendChild(favImg);
            }
            const domSpan = document.createElement("span");
            domSpan.textContent = item.domain || "link";
            domainRow.appendChild(domSpan);
            meta.appendChild(domainRow);

            /* Title */
            const tEl = document.createElement("div");
            tEl.className = "title";
            tEl.textContent = item.title || item.url;
            meta.appendChild(tEl);

            /* Description */
            if (item.description) {
                const descEl = document.createElement("div");
                descEl.className = "desc";
                descEl.textContent = item.description;
                meta.appendChild(descEl);
            }

            /* Sub with saved date & author */
            const subEl = document.createElement("div");
            subEl.className = "sub";
            const dateStr = new Date(item.savedAt).toLocaleDateString(undefined, { month: "short", day: "numeric" });
            subEl.textContent = [item.author, dateStr].filter(Boolean).join(" \u00b7 ");
            meta.appendChild(subEl);

            a.appendChild(meta);
            linksList.appendChild(a);
        });
    }

    /* Helper: Detect if string is a URL */
    function isUrlLike(str) {
        const s = str.trim();
        if (!s || s.includes(" ")) return false;
        return /^https?:\/\//i.test(s) || /^[a-zA-Z0-9-]+\.[a-zA-Z]{2,}(\/.*)?$/i.test(s);
    }

    /* IMDb SUGGESTIONS */
    function imdbNorm(q) {
        return (q || "").toLowerCase().trim().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
    }
    function _walkStr(node, out = []) {
        if (typeof node === "string") out.push(node);
        else if (node && typeof node === "object") Object.values(node).forEach(v => _walkStr(v, out));
        return out;
    }
    function _parseImdb(strings) {
        for (const s of strings) {
            const m = s.match(/\{[\s\S]*?"d"\s*:\s*\[[\s\S]*?\]\s*[\s\S]*?\}/);
            if (m) { try { return JSON.parse(m[0]); } catch {} }
        }
        return null;
    }

    /* Primary: Microlink API */
    async function _imdbMicrolink(norm) {
        const url = "https://sg.media-imdb.com/suggests/" + norm.charAt(0) + "/" + encodeURIComponent(norm) + ".json";
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), 2500);
        const r = await fetch("https://api.microlink.io/?url=" + encodeURIComponent(url), { signal: ctrl.signal });
        clearTimeout(tid);
        if (!r.ok) return null;
        const j = await r.json();
        const p = _parseImdb(_walkStr(j));
        return p && Array.isArray(p.d) ? p.d : null;
    }

    /* Resilient fallback: Direct JSONP (works natively in browser without CORS/rate limits) */
    function _imdbJsonp(norm) {
        return new Promise(res => {
            const cb = "imdb$" + norm;
            const s  = document.createElement("script");
            const tid = setTimeout(() => { delete window[cb]; s.remove(); res(null); }, 3000);
            const done = d => {
                clearTimeout(tid);
                delete window[cb];
                s.remove();
                res(d);
            };
            window[cb] = data => done(data && Array.isArray(data.d) ? data.d : null);
            s.onerror  = () => done(null);
            s.src = "https://sg.media-imdb.com/suggests/" + norm.charAt(0) + "/" + encodeURIComponent(norm) + ".json";
            document.head.appendChild(s);
        });
    }

    /* Fallback: AllOrigins */
    async function _imdbAllorigins(norm) {
        const url = "https://sg.media-imdb.com/suggests/" + norm.charAt(0) + "/" + encodeURIComponent(norm) + ".json";
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), 2500);
        const r = await fetch("https://api.allorigins.win/get?url=" + encodeURIComponent(url), { signal: ctrl.signal });
        clearTimeout(tid);
        if (!r.ok) return null;
        const j = await r.json();
        const p = _parseImdb([j.contents || ""]);
        return p && Array.isArray(p.d) ? p.d : null;
    }

    async function getImdbSuggestions(query) {
        const norm = imdbNorm(query);
        if (!norm) return [];
        const key = "imdb:" + norm;
        const hit = mGet(key);
        if (hit) return hit;

        let items = null;
        try { items = await _imdbMicrolink(norm); } catch {}
        if (!items || !items.length) {
            try { items = await _imdbJsonp(norm); } catch {}
        }
        if (!items || !items.length) {
            try { items = await _imdbAllorigins(norm); } catch {}
        }

        const result = items || [];
        if (result.length) mSet(key, result);
        return result;
    }

    let _currentSuggestions = [];
    let _sugIndex = -1;

    /* Instant dismiss: cancel pending requests, clear DOM and reset selection */
    function dismissSuggestions() {
        clearTimeout(sugTimer);
        sugToken++;
        if (box) {
            box.style.display = "none";
            box.innerHTML = "";
        }
        _currentSuggestions = [];
        _sugIndex = -1;
    }

    function showSuggestions(items, query = "") {
        _currentSuggestions = items || [];
        _sugIndex = -1;
        box.innerHTML = "";

        /* Special smart suggestion: If query is a URL, show "Save Link with Metadata & Thumbnail" */
        if (query && isUrlLike(query)) {
            const saveRow = document.createElement("div");
            saveRow.className = "sug-row sug-save-row";
            saveRow.setAttribute("role", "option");

            const iconPh = document.createElement("div");
            iconPh.className = "sug-thumb-ph";

            const txt = document.createElement("div");
            txt.className = "sug-text";
            const titleEl = document.createElement("div");

            titleEl.textContent = "Save link with thumbnail & metadata";
            const metaEl = document.createElement("div");
            metaEl.className = "sug-meta";
            metaEl.textContent = query;
            txt.append(titleEl, metaEl);
            saveRow.appendChild(txt);

            const btn = document.createElement("button");

            btn.textContent = "Save Link";
            saveRow.appendChild(btn);

            saveRow.addEventListener("click", async e => {
                e.stopPropagation();
                dismissSuggestions();
                input.value = "";
                await handleSaveUrl(query);
            });

            box.appendChild(saveRow);
        }

        if (!_currentSuggestions.length && !box.children.length) {
            box.style.display = "none";
            return;
        }

        _currentSuggestions.slice(0, 7).forEach((item, idx) => {
            const row = document.createElement("div");
            row.className = "sug-row";
