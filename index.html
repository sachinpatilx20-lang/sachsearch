            /* Thumbnail / Poster */
            const imgUrl = getImdbImageUrl(item);
            if (imgUrl) {
                const img = document.createElement("img");
                img.className = "sug-thumb";
                img.alt = "";
                img.loading = "lazy";
                loadThumb(img, imgUrl, "imdb:" + item.id);
                row.appendChild(img);
            } else {
                const ph = document.createElement("div");
                ph.className = "sug-thumb-ph";
                ph.textContent = "\ud83c\udfac";
                row.appendChild(ph);
            }

            /* Title & Year / Type metadata */
            const txt = document.createElement("div");
            txt.className = "sug-text";

            const titleEl = document.createElement("div");
            titleEl.className = "sug-title";
            titleEl.textContent = item.l;

            const typeLabel = formatImdbType(item.q);
            const parts = [];
            if (item.y) parts.push(item.y);
            if (typeLabel) parts.push(typeLabel);
            if (item.s) parts.push(item.s);

            const metaEl = document.createElement("div");
            metaEl.className = "sug-meta";
            metaEl.textContent = parts.join(" \u00b7 ");

            txt.append(titleEl, metaEl);
            row.appendChild(txt);

            /* Action Buttons: Watch Later toggle & Direct IMDb link */
            const actions = document.createElement("div");
            actions.className = "sug-actions";

            if (item.id) {
                const wlBtn = document.createElement("button");
                wlBtn.className = "sug-wl-btn" + (isWatchLater(item.id) ? " saved" : "");
                wlBtn.type = "button";
                wlBtn.textContent = isWatchLater(item.id) ? "\u25f7 Saved" : "\u25f7 Later";
                wlBtn.title = isWatchLater(item.id) ? "Remove from Watch Later" : "Save to Watch Later";
                wlBtn.addEventListener("click", e => {
                    e.stopPropagation();
                    toggleWatchLater({
                        id:       item.id,
                        type:     "imdb",
                        title:    item.l,
                        channel:  [item.y, typeLabel].filter(Boolean).join(" \u00b7 "),
                        length:   "",
                        thumbUrl: imgUrl || ""
                    });
                });
                actions.appendChild(wlBtn);
            }

            /* Direct IMDb Page link */
            if (item.id) {
                const link = document.createElement("a");
                link.className = "sug-link";
                link.href = "https://www.imdb.com/title/" + encodeURIComponent(item.id) + "/";
                link.target = "_blank";
                link.rel = "noopener";
                link.title = "View on IMDb";
                link.textContent = "IMDb \u2197";
                link.addEventListener("click", e => e.stopPropagation());
                actions.appendChild(link);
            }

            row.appendChild(actions);

            row.addEventListener("click", () => {
                selectSuggestion(item);
            });

            box.appendChild(row);
        });

        box.style.display = box.children.length ? "block" : "none";
    }

    function selectSuggestion(item) {
        input.value = item.l;
        dismissSuggestions();
        syncAppLinks();
        try { sessionStorage.setItem("sach_last_q", item.l); } catch {}
        input.focus();
        loadYouTube(item.l);
    }

    function updateSugSelection() {
        const rows = box.querySelectorAll(".sug-row");
        rows.forEach((r, i) => {
            if (i === _sugIndex) {
                r.classList.add("active");
                r.scrollIntoView({ block: "nearest" });
            } else {
                r.classList.remove("active");
            }
        });
    }

    /* YOUTUBE - allorigins scrape + oEmbed enrichment (Search only) */
    async function _ytScrape(query) {
        const ytUrl = "https://www.youtube.com/results?search_query=" + encodeURIComponent(query);
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), 7000);
        const resp = await fetch("https://api.allorigins.win/get?url=" + encodeURIComponent(ytUrl), { signal: ctrl.signal });
        clearTimeout(tid);
        if (!resp.ok) return [];
        const json = await resp.json();
        const html = json.contents || "";

        /* Brace-counter extract of ytInitialData */
        const start = html.indexOf("ytInitialData =");
        if (start === -1) return [];
        const brace = html.indexOf("{", start);
        if (brace === -1) return [];
        let depth = 0, end = -1;
        for (let i = brace; i < html.length; i++) {
            if (html[i] === "{") depth++;
            else if (html[i] === "}") { if (--depth === 0) { end = i; break; } }
        }
        if (end === -1) return [];

        let data;
        try { data = JSON.parse(html.slice(brace, end + 1)); } catch { return []; }

        const videos = [], seen = new Set();
        (function walk(n) {
            if (videos.length >= 8 || !n || typeof n !== "object") return;
            const v = n.videoRenderer;
            if (v && v.videoId && !seen.has(v.videoId)) {
                seen.add(v.videoId);
                videos.push({
                    id: v.videoId,
                    title:    v.title?.runs?.[0]?.text ?? (v.title?.simpleText || "Untitled"),
                    channel:  v.ownerText?.runs?.[0]?.text ?? "",
                    length:   v.lengthText?.simpleText ?? "",
                    thumbUrl: "https://i.ytimg.com/vi/" + v.videoId + "/mqdefault.jpg"
                });
            }
            for (const k in n) walk(n[k]);
        })(data);
        return videos;
    }

    const _oeFlight = new Map();
    async function _ytOembed(id) {
        const key = "yt-oe:" + id;
        const hit = mGet(key);
        if (hit) return hit;
        if (_oeFlight.has(id)) return _oeFlight.get(id);

        const p = (async () => {
            try {
                const oeUrl = "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=" + id + "&format=json";
                const ctrl = new AbortController();
                const tid = setTimeout(() => ctrl.abort(), 3500);
                const resp = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(oeUrl), { signal: ctrl.signal });
                clearTimeout(tid);
                if (!resp.ok) return null;
                const d = await resp.json();
                const meta = {
                    title:    d.title || "",
                    channel:  d.author_name || "",
                    thumbUrl: d.thumbnail_url || ("https://i.ytimg.com/vi/" + id + "/hqdefault.jpg")
                };
                mSet(key, meta);
                return meta;
            } catch { return null; }
            finally { _oeFlight.delete(id); }
        })();

        _oeFlight.set(id, p);
        return p;
    }

    function renderYouTube(videos, query = "", isFromCache = false) {
        ytList.innerHTML = "";
        ytStatus.innerHTML = "";

        if (!videos || !videos.length) {
            ytStatus.innerHTML = 'No direct results from proxy. <a href="https://www.youtube.com/results?search_query=' +
                encodeURIComponent(query) + '" target="_blank" rel="noopener" style="color:#8ab4ff;text-decoration:underline">Search directly on YouTube \u2197</a>';
            return;
        }

        if (isFromCache && query) {
            ytStatus.innerHTML = 'Showing ' + videos.length + ' results <span class="badge-cache">\u26a1 local cache</span>';
        } else if (query) {
            ytStatus.innerHTML = 'Showing ' + videos.length + ' results';
        }

        videos.forEach((v, index) => {
            const a = document.createElement("a");
            a.className = "card";
            a.href = "https://www.youtube.com/watch?v=" + encodeURIComponent(v.id);
            a.target = "_blank";
            a.rel = "noopener";

            /* Watch Later toggle button */
            const wlBtn = document.createElement("button");
            wlBtn.className = "wl-btn" + (isWatchLater(v.id) ? " saved" : "");
            wlBtn.type = "button";
            wlBtn.dataset.id = v.id;
            wlBtn.title = isWatchLater(v.id) ? "Saved in Watch Later (click to remove)" : "Save to Watch Later";
            wlBtn.setAttribute("aria-label", "Save to Watch Later");
            wlBtn.innerHTML = `
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
            `;
            wlBtn.addEventListener("click", e => {
                e.preventDefault();
                e.stopPropagation();
                toggleWatchLater({
                    id:       v.id,
                    type:     "yt",
                    title:    v.title,
                    channel:  v.channel,
                    length:   v.length,
                    thumbUrl: v.thumbUrl
                });
            });
            a.appendChild(wlBtn);

            /* Thumbnail preview fixed by natural aspect ratio */
            const thumbWrap = document.createElement("div");
            thumbWrap.className = "card-thumb-wrap";

            const img = document.createElement("img");
            img.alt = "";
            img.loading = "lazy";
            thumbWrap.appendChild(img);

            loadThumb(img, v.thumbUrl, "yt:" + v.id);

            if (v.length) {
                const dur = document.createElement("span");
                dur.className = "duration";
                dur.textContent = v.length;
                thumbWrap.appendChild(dur);
            }

            const meta  = document.createElement("div");
            meta.className = "meta";

            const tEl = document.createElement("div");
            tEl.className = "title";
            tEl.textContent = v.title;

            const subEl = document.createElement("div");
            subEl.className = "sub";
            subEl.textContent = [v.channel, v.length].filter(Boolean).join(" \u00b7 ");

            meta.append(tEl, subEl);
            a.append(thumbWrap, meta);
            ytList.appendChild(a);

            /* Staggered oEmbed enhancement */
            setTimeout(() => {
                _ytOembed(v.id).then(oe => {
                    if (!oe) return;
                    if (oe.title && oe.title !== tEl.textContent) tEl.textContent = oe.title;
                    if (oe.channel && oe.channel !== v.channel) {
                        subEl.textContent = [oe.channel, v.length].filter(Boolean).join(" \u00b7 ");
                    }
                    if (oe.thumbUrl && oe.thumbUrl !== v.thumbUrl) {
                        loadThumb(img, oe.thumbUrl, "yt-hq:" + v.id);
                    }
                });
            }, index * 120);
        });
    }

    let ytToken = 0;
    async function loadYouTube(query) {
        const token = ++ytToken;
        ytBox.style.display  = "block";
        ytList.innerHTML     = "";
        ytStatus.textContent = "Loading videos\u2026";

        const key = "yt:" + query.toLowerCase().trim();
        let videos = mGet(key);
        let fromCache = false;

        if (videos && videos.length) {
            fromCache = true;
        } else {
            try {
                videos = await _ytScrape(query);
            } catch {
                videos = [];
            }
            if (videos.length) mSet(key, videos);
        }

        if (token !== ytToken) return;
        renderYouTube(videos || [], query, fromCache);
    }

    /* INPUT WIRING & KEYBOARD NAVIGATION */
    let sugTimer, ytTimer, sugToken = 0;

    input.addEventListener("input", () => {
        const q = input.value.trim();
        clearTimeout(sugTimer);
        syncAppLinks();

        if (q) {
            try { sessionStorage.setItem("sach_last_q", q); } catch {}
        } else {
            try { sessionStorage.removeItem("sach_last_q"); } catch {}
            ytBox.style.display = "none";
            ytToken++;
        }

        if (!q) {
            dismissSuggestions();
            return;
        }

        sugTimer = setTimeout(async () => {
            const tok = ++sugToken;
            const items = await getImdbSuggestions(q);
            if (tok === sugToken) showSuggestions(items, q);
        }, 220);

        scheduleYouTube();
    });

    input.addEventListener("keydown", e => {
        const rows = box.querySelectorAll(".sug-row");

        if (e.key === "ArrowDown" && rows.length) {
            e.preventDefault();
            _sugIndex = (_sugIndex + 1) % rows.length;
            updateSugSelection();
            return;
        }
        if (e.key === "ArrowUp" && rows.length) {
            e.preventDefault();
            _sugIndex = (_sugIndex - 1 + rows.length) % rows.length;
            updateSugSelection();
            return;
        }
        if (e.key === "Escape") {
            e.preventDefault();
            if (box && box.style.display !== "none" && (box.children.length > 0 || _currentSuggestions.length > 0)) {
                dismissSuggestions();
            } else {
                dismissSuggestions();
                input.value = "";
                syncAppLinks();
                try { sessionStorage.removeItem("sach_last_q"); } catch {}
                ytBox.style.display = "none";
                ytToken++;
            }
            return;
        }
        if (e.key === "Enter") {
            if (_sugIndex >= 0 && rows[_sugIndex]) {
                e.preventDefault();
                rows[_sugIndex].click();
                return;
            }
            const q = input.value.trim();
            if (q) {
                dismissSuggestions();
                window.open(targetUrl(APPS.find(a => a[0] === "Google")), "_blank");
            }
        }
    });

    function scheduleYouTube() {
        clearTimeout(ytTimer);
        const q = input.value.trim();
        if (q.length < 3 || isUrlLike(q)) return;
        ytTimer = setTimeout(() => loadYouTube(q), 750);
    }

    /* Dismiss suggestions when clicking outside */
    document.addEventListener("click", e => {
        if (!e.target.closest(".search")) {
            dismissSuggestions();
        }
    });

    /* Keyboard Navigation: Press 'Escape' anywhere to close suggestions/modals, '/' to focus search */
    document.addEventListener("keydown", e => {
        if (e.key === "Escape") {
            if (box && box.style.display !== "none") {
                e.preventDefault();
                dismissSuggestions();
                return;
            }
            if (addLinkBox && addLinkBox.style.display === "block") {
                addLinkBox.style.display = "none";
                return;
            }
            if (addAppBox && addAppBox.style.display === "block") {
                toggleAddAppBox(false);
                return;
            }
        }
        if (e.key === "/" && document.activeElement !== input && document.activeElement !== addLinkInput && document.activeElement !== addAppUrlInput && document.activeElement !== addAppNameInput) {
            e.preventDefault();
            input.focus();
            input.select();
        }
    });

        /* Initialization on DOM ready */
    window.addEventListener("DOMContentLoaded", () => {

        renderApps();
        renderWatchLater();
        renderSavedLinks();

        try {
            const wasWlOpen = localStorage.getItem(WL_OPEN_KEY);
            const wlItems   = getWatchLater();
            if (wasWlOpen === "1") {
                wlSection.style.display = "block";
                wlToggleBtn.classList.add("active");
                wlToggleBtn.setAttribute("aria-expanded", "true");
            }

            const wasLinksOpen = localStorage.getItem(LINKS_OPEN_KEY);
            if (wasLinksOpen === "1") {
                linksSection.style.display = "block";
                linksToggleBtn.classList.add("active");
                linksToggleBtn.setAttribute("aria-expanded", "true");
            }
        } catch {}

        /* Restore last active query from sessionStorage on page load */
        try {
            const saved = sessionStorage.getItem("sach_last_q");
            if (saved && saved.trim()) {
                input.value = saved.trim();
                syncAppLinks();
                scheduleYouTube();
            }
        } catch {}
    });
    </script>
