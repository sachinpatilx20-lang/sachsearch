<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACH.IN</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: black;
            color: #eee;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8vh 16px 32px;
        }
        h1 { letter-spacing: 6px; font-weight: 600; margin: 0 0 28px; }
        .search { position: relative; width: 100%; max-width: 560px; }
        #search {
            width: 100%;
            padding: 14px 18px;
            font-size: 18px;
            color: #fff;
            background: #151515;
            border: 1px solid #333;
            border-radius: 999px;
            outline: none;
        }
        #search:focus { border-color: #888; }
        #suggestions {
            position: absolute; top: 56px; left: 0; right: 0;
            background: #151515; border: 1px solid #333; border-radius: 14px;
            overflow: hidden; z-index: 10; display: none;
        }
        #suggestions div { padding: 10px 18px; cursor: pointer; font-size: 15px; }
        #suggestions div:hover { background: #262626; }
        #suggestions small { color: #888; margin-left: 8px; }
        .hint { color: #777; font-size: 13px; margin-top: 12px; }
        .apps {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 700px;
            margin-top: 36px;
        }
        .apps a {
            display: block; text-align: center; padding: 16px 8px;
            background: #151515; border: 1px solid #2a2a2a; border-radius: 12px;
            color: #eee; text-decoration: none; font-size: 15px;
            transition: background .15s, transform .15s;
        }
        .apps a:hover { background: #262626; transform: translateY(-2px); }

        #yt { width: 100%; max-width: 700px; margin-top: 36px; display: none; }
        #yt h2 { font-size: 15px; color: #aaa; font-weight: 500; margin: 0 0 12px; }
        #yt .status { color: #777; font-size: 14px; }
        #yt .list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        #yt .card {
            background: #151515; border: 1px solid #2a2a2a; border-radius: 12px;
            overflow: hidden; color: #eee; text-decoration: none; display: block;
        }
        #yt .card:hover { background: #262626; }
        #yt .card img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; background: #222; }
        #yt .card .meta { padding: 8px 10px 10px; font-size: 13px; }
        #yt .card .title { font-size: 14px; line-height: 1.3; margin-bottom: 4px; }
        #yt .card .sub { color: #888; }
    </style>
</head>
<body>
    <h1>SACH.IN</h1>

    <div class="search">
        <input type="text" id="search" placeholder="Search" autocomplete="off" autofocus>
        <div id="suggestions"></div>
    </div>
    <div class="hint">Enter = Google search. Click an app to search it with your text.</div>

    <div class="apps" id="apps"></div>

    <div id="yt">
        <h2>YouTube results</h2>
        <div class="status" id="ytStatus"></div>
        <div class="list" id="ytList"></div>
    </div>

    <script>
        /* ---------- App tiles ---------- */
        // [label, search URL prefix, noSearch (just open the site)]
        const APPS = [
            ["Netflix",     "https://www.netflix.com/search?q="],
            ["Hotstar",     "https://www.hotstar.com/in/explore?search_query="],
            ["Prime Video", "https://www.primevideo.com/search?ie=UTF8&ref_=atv_nb_sug&phrase="],
            ["ZEE5",        "https://www.zee5.com/search?q="],
            ["SonyLIV",     "https://www.sonyliv.com/search?q="],
            ["YouTube",     "https://www.youtube.com/results?search_query="],
            ["Spotify",     "https://open.spotify.com/search/"],
            ["Google",      "https://www.google.com/search?q="],
            ["WhatsApp",    "https://web.whatsapp.com/", true],
            ["Telegram",    "https://web.telegram.org/", true],
            ["Instagram",   "https://instagram.com/", true],
            ["IMDb",        "https://www.imdb.com/find/?q="],
            ["JustWatch",   "https://www.justwatch.com/in/search?q="],
            ["X",           "https://x.com/search?q="],
            ["Reddit",      "https://www.reddit.com/search/?q="]
        ];

        const input = document.getElementById("search");
        const box = document.getElementById("suggestions");
        const appsEl = document.getElementById("apps");
        const ytBox = document.getElementById("yt");
        const ytStatus = document.getElementById("ytStatus");
        const ytList = document.getElementById("ytList");

        function targetUrl(app) {
            const q = input.value.trim();
            const [, base, noSearch] = app;
            return (noSearch || !q) ? base : base + encodeURIComponent(q);
        }

        APPS.forEach(app => {
            const a = document.createElement("a");
            a.textContent = app[0];
            a.href = app[1];
            a.target = "_blank";
            a.rel = "noopener";
            a.addEventListener("click", () => { a.href = targetUrl(app); }); // uses current text
            appsEl.appendChild(a);
        });

        input.addEventListener("keydown", e => {
            if (e.key === "Enter" && input.value.trim()) {
                window.open(targetUrl(APPS.find(a => a[0] === "Google")), "_blank");
            }
        });

        /* ---------- IMDb suggestions via microlink ---------- */
        function imdbKey(query) {
            // IMDb's suggestion files are lowercase with underscores for spaces/symbols
            return query.toLowerCase().trim().replace(/[^a-z0-9]+/g, "_");
        }

        function walkStrings(node, out = []) {
            if (typeof node === "string") out.push(node);
            else if (node && typeof node === "object") Object.values(node).forEach(v => walkStrings(v, out));
            return out;
        }

        // IMDb returns JSONP: imdb$spider({...}). Pull the {...} out of whatever string holds it.
        function parseImdbPayload(strings) {
            for (const s of strings) {
                const m = s.match(/\{[\s\S]*"d"\s*:\s*\[[\s\S]*\}/);
                if (m) { try { return JSON.parse(m[0]); } catch (e) { /* keep looking */ } }
            }
            return null;
        }

        async function imdbViaMicrolink(query) {
            const key = imdbKey(query);
            const url = `https://sg.media-imdb.com/suggests/${key.charAt(0)}/${encodeURIComponent(key)}.json`;
            const response = await fetch(`https://api.microlink.io/?url=${encodeURIComponent(url)}`);
            const json = await response.json();
            const payload = parseImdbPayload(walkStrings(json));
            return payload && Array.isArray(payload.d) ? payload.d : null;
        }

        // Fallback if microlink doesn't hand back the body: load IMDb's JSONP directly.
        function imdbViaJsonp(query) {
            return new Promise(resolve => {
                const key = imdbKey(query);
                const cb = "imdb$" + key;
                const s = document.createElement("script");
                const done = d => { delete window[cb]; s.remove(); resolve(d); };
                window[cb] = data => done(data && Array.isArray(data.d) ? data.d : null);
                s.onerror = () => done(null);
                s.src = `https://sg.media-imdb.com/suggests/${key.charAt(0)}/${encodeURIComponent(key)}.json`;
                document.head.appendChild(s);
            });
        }

        async function getImdbSuggestions(query) {
            let items = null;
            try { items = await imdbViaMicrolink(query); } catch (e) { /* fall through */ }
            if (!items || !items.length) items = await imdbViaJsonp(query);
            return items || [];
        }

        function showSuggestions(items) {
            box.innerHTML = "";
            items.slice(0, 6).forEach(item => {
                const row = document.createElement("div");
                row.textContent = item.l;
                if (item.y) {
                    const y = document.createElement("small");
                    y.textContent = item.y;
                    row.appendChild(y);
                }
                row.addEventListener("click", () => {
                    input.value = item.l;
                    box.style.display = "none";
                    input.focus();
                    scheduleYouTube();
                });
                box.appendChild(row);
            });
            box.style.display = box.children.length ? "block" : "none";
        }

        /* ---------- YouTube results via allorigins ---------- */
        const ytCache = new Map();

        async function youtubeViaAllOrigins(searchQuery) {
            const response = await fetch(
                `https://api.allorigins.win/get?url=${encodeURIComponent('https://www.youtube.com/results?search_query=' + encodeURIComponent(searchQuery))}`
            );
            const json = await response.json();
            const html = json.contents || "";
            const m = html.match(/ytInitialData\s*=\s*(\{[\s\S]*?\});\s*<\/script>/);
            if (!m) return [];
            const data = JSON.parse(m[1]);

            const videos = [];
            const seen = new Set();
            (function walk(n) {
                if (videos.length >= 8 || !n || typeof n !== "object") return;
                const v = n.videoRenderer;
                if (v && v.videoId && !seen.has(v.videoId)) {
                    seen.add(v.videoId);
                    videos.push({
                        id: v.videoId,
                        title: (v.title && v.title.runs && v.title.runs[0] && v.title.runs[0].text) || "Untitled",
                        channel: (v.ownerText && v.ownerText.runs && v.ownerText.runs[0] && v.ownerText.runs[0].text) || "",
                        length: (v.lengthText && v.lengthText.simpleText) || ""
                    });
                }
                for (const k in n) walk(n[k]);
            })(data);
            return videos;
        }

        function renderYouTube(videos, searchQuery) {
            ytList.innerHTML = "";
            if (!videos.length) {
                ytStatus.textContent = "No results (the proxy may be rate-limited or blocked). ";
                const a = document.createElement("a");
                a.href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(searchQuery);
                a.target = "_blank"; a.rel = "noopener";
                a.style.color = "#8ab4ff";
                a.textContent = "Open on YouTube";
                ytStatus.appendChild(a);
                return;
            }
            ytStatus.textContent = "";
            videos.forEach(v => {
                const a = document.createElement("a");
                a.className = "card";
                a.href = "https://www.youtube.com/watch?v=" + encodeURIComponent(v.id);
                a.target = "_blank"; a.rel = "noopener";

                const img = document.createElement("img");
                img.src = `https://i.ytimg.com/vi/${encodeURIComponent(v.id)}/mqdefault.jpg`;
                img.alt = "";
                img.loading = "lazy";

                const meta = document.createElement("div");
                meta.className = "meta";
                const t = document.createElement("div");
                t.className = "title";
                t.textContent = v.title;
                const sub = document.createElement("div");
                sub.className = "sub";
                sub.textContent = [v.channel, v.length].filter(Boolean).join(" · ");
                meta.append(t, sub);

                a.append(img, meta);
                ytList.appendChild(a);
            });
        }

        let ytToken = 0;
        async function loadYouTube(searchQuery) {
            const token = ++ytToken;
            ytBox.style.display = "block";
            ytList.innerHTML = "";
            ytStatus.textContent = "Loading…";
            let videos;
            if (ytCache.has(searchQuery)) {
                videos = ytCache.get(searchQuery);
            } else {
                try { videos = await youtubeViaAllOrigins(searchQuery); } catch (e) { videos = []; }
                if (videos.length) ytCache.set(searchQuery, videos);
            }
            if (token !== ytToken) return; // a newer search replaced this one
            renderYouTube(videos, searchQuery);
        }

        /* ---------- Input wiring ---------- */
        let sugTimer, ytTimer, sugToken = 0;

        input.addEventListener("input", () => {
            const q = input.value.trim();
            clearTimeout(sugTimer);
            if (!q) { box.style.display = "none"; ytBox.style.display = "none"; ytToken++; return; }
            sugTimer = setTimeout(async () => {
                const token = ++sugToken;
                const items = await getImdbSuggestions(q);
                if (token === sugToken) showSuggestions(items);
            }, 250);
            scheduleYouTube();
        });

        function scheduleYouTube() {
            clearTimeout(ytTimer);
            const q = input.value.trim();
            if (q.length < 3) return;
            ytTimer = setTimeout(() => loadYouTube(q), 800);
        }

        document.addEventListener("click", e => {
            if (!e.target.closest(".search")) box.style.display = "none";
        });
    </script>
</body>
</html>
