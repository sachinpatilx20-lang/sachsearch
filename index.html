<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>SACH.IN</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
</head>
<body>
    <div class="app-container">
        <!-- HEADER -->
        <header class="header">
            <div class="brand-section">
                <a href="./" class="brand-logo">SACH.IN</a>
            </div>
            <div class="header-actions">
                <button type="button" id="wlToggleBtn" class="btn-icon-text" aria-expanded="false" title="Watch Later">
                    <span>⏱</span>
                    <span>Later</span>
                    <span id="wlBadge" class="header-badge">0</span>
                </button>
                <button type="button" id="linksToggleBtn" class="btn-icon-text" aria-expanded="false" title="Saved Links">
                    <span>⎘</span>
                    <span>Saved</span>
                    <span id="linksBadge" class="header-badge">0</span>
                </button>
                <button type="button" id="addAppToggleBtn" class="btn-icon-text" title="Add App">
                    <span>+</span>
                    <span>Add</span>
                </button>
                <button type="button" id="btn-reset-sources" class="btn-icon-text" title="Reset defaults">
                    <span>↺</span>
                </button>
            </div>
        </header>

        <!-- SEARCH COCKPIT -->
        <section class="search-cockpit" aria-label="Search">
            <div class="search-input-wrapper">
                <div class="search-icon-prefix" aria-hidden="true">&gt;_</div>
                <input 
                    type="text" 
                    id="search-input" 
                    class="search-input" 
                    placeholder="Search movie, stream, or paste URL..." 
                    autocomplete="off" 
                    spellcheck="false"
                    autofocus
                >
                <button type="button" id="search-clear" class="search-input-clear" title="Clear">×</button>
                <button type="button" id="search-button" class="search-submit-btn">
                    <span>Search</span>
                    <span aria-hidden="true">↵</span>
                </button>
            </div>

            <!-- Instant IMDb & URL Suggestions Dropdown -->
            <div id="suggestions" class="suggestions-box" role="listbox"></div>

            <div class="cockpit-toolbar">
                <div class="cockpit-stats">
                    <span id="current-query-display">READY</span>
                    <span id="active-count" class="highlight">0 ENGINES</span>
                </div>
            </div>

            <!-- Recent Queries -->
            <div class="recent-searches-row">
                <span class="recent-label">Recent:</span>
                <div id="recent-tags" class="recent-tags-container"></div>
                <button type="button" id="btn-clear-history" class="btn-clear-history" title="Clear history">Clear</button>
            </div>
        </section>

        <!-- ADD APP DRAWER -->
        <div id="addAppBox" class="drawer-box" style="display: none;">
            <div class="drawer-header">
                <span class="drawer-title">+ Add Engine / App</span>
                <button type="button" id="addAppCancelBtn" class="btn-mini-icon">×</button>
            </div>
            <div class="drawer-row">
                <input type="text" id="addAppUrlInput" class="form-input" placeholder="URL or Search URL (e.g. https://... or twitch.tv)" autocomplete="off">
                <input type="text" id="addAppNameInput" class="form-input" placeholder="Name (optional)" autocomplete="off">
                <button type="button" id="addAppSubmitBtn" class="btn-action-primary">Add</button>
            </div>
            <div class="drawer-options">
                <label class="drawer-checkbox">
                    <input type="checkbox" id="addAppDirectCheck">
                    <span>Open directly (no search query)</span>
                </label>
            </div>
            <div id="addAppStatus" class="form-status"></div>
        </div>

        <!-- WATCH LATER SECTION (Collapsible) -->
        <section id="wlSection" class="collapsible-section" style="display: none;">
            <div class="section-header">
                <h2>Watch Later <span id="wlCountText" class="badge-count">0</span></h2>
                <button type="button" id="wlClearBtn" class="btn-mini-danger">Clear All</button>
            </div>
            <div id="wlList" class="cards-grid"></div>
        </section>

        <!-- SAVED LINKS SECTION (Collapsible) -->
        <section id="linksSection" class="collapsible-section" style="display: none;">
            <div class="section-header">
                <h2>Saved Links <span id="linksCountText" class="badge-count">0</span></h2>
                <div class="header-actions">
                    <button type="button" id="linksRefreshAllBtn" class="btn-icon-text">↺ Refresh All</button>
                    <button type="button" id="linksClearBtn" class="btn-mini-danger">Clear All</button>
                </div>
            </div>
            <div id="linksList" class="cards-grid"></div>
        </section>

        <!-- APP / ENGINE TILES GRID -->
        <main>
            <div id="apps" class="apps-grid"></div>
        </main>

        <!-- YOUTUBE RESULTS (Search Triggered) -->
        <section id="ytSection" class="collapsible-section" style="display: none;">
            <div class="section-header">
                <h2>YouTube Results</h2>
                <div id="ytStatus" class="section-status"></div>
            </div>
            <div id="ytList" class="cards-grid"></div>
        </section>

        <!-- FOOTER -->
        <footer class="footer">
            <div>SACH.IN &copy; 2026</div>
        </footer>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toast-container" class="toast-container" aria-live="assertive"></div>

    <script src="app.js" defer></script>
</body>
</html>
